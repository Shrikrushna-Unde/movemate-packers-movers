# Netlify configuration for the React frontend.
#
# The redirect at the bottom is the single most important line in this file for any SPA.
# Without it, a visitor who refreshes the page on /services gets Netlify's 404: the host looks
# for a file called "services", does not find one, and never loads index.html - so React
# Router never gets the chance to handle the route. The 200 status (not 301) means the URL
# stays as the user typed it.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Long-lived caching is safe for Vite's output because every asset filename contains a content
# hash - a changed file gets a new name, so a stale cache can never serve the wrong version.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

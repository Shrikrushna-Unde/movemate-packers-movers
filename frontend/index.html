<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Required for any responsive layout: without it, mobile browsers render the page at
         980px wide and zoom out, which makes every Tailwind breakpoint useless. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO basics. A moving company lives on local search, so the title leads with the
         service and the city rather than the brand name. -->
    <title>MoveMate Packers & Movers | Home Shifting, Office Relocation & Car Transport</title>
    <meta
      name="description"
      content="Get an instant, itemised moving quote online. Professional packing, GPS-tracked transport and transit insurance for home shifting, office relocation and vehicle transport across India."
    />
    <meta name="theme-color" content="#141b57" />

    <!-- Open Graph tags control how the link looks when shared on WhatsApp or LinkedIn -
         worth having when you are going to paste this URL on a resume. -->
    <meta property="og:title" content="MoveMate Packers & Movers" />
    <meta
      property="og:description"
      content="Instant online quotes, professional packing and GPS-tracked moves across India."
    />
    <meta property="og:type" content="website" />

    <!-- preconnect opens the TCP + TLS handshake to the font host early, so the font request
         itself does not have to wait for it. A genuine, measurable load-time win. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- An inline SVG favicon: no extra network request, and it scales crisply. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141b57'/%3E%3Cpath d='M6 20h14v-7H6zM20 20h6l-2-5h-4z' fill='%23fbbf24'/%3E%3Ccircle cx='10' cy='22' r='2' fill='%23fff'/%3E%3Ccircle cx='23' cy='22' r='2' fill='%23fff'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!--
      The single mount point. React takes over this div and renders the whole application
      inside it - that is what "single page application" means: one HTML file, and routing
      handled in JavaScript.
    -->
    <div id="root"></div>

    <!-- type="module" is what lets Vite serve ES modules directly in development. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

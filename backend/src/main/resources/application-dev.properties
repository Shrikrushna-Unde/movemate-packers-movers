# ===================================================================
#  `dev` profile - run the whole application with NOTHING installed.
#
#      mvn spring-boot:run -Dspring-boot.run.profiles=dev
#
#  No MySQL server, no Docker, no cloud account. The database is H2
#  running inside the same JVM as the application.
#
#  Use this for local development and demos. Use the default profile
#  (or `prod`) when you want to run against real MySQL.
# ===================================================================

# -------------------------------------------------------------------
#  Embedded H2 database
# -------------------------------------------------------------------
#  jdbc:h2:mem:movemate   in-memory: nothing is written to disk, so there is no
#                         data directory to clean up and every start is identical
#  MODE=MySQL             H2's MySQL compatibility mode, so SQL behaves closer to
#                         production (string comparison, LIMIT syntax, functions)
#  DATABASE_TO_LOWER=TRUE H2 folds unquoted identifiers to UPPERCASE by default while
#                         MySQL keeps them lowercase; this matches our snake_case columns
#  DB_CLOSE_DELAY=-1      keep the database alive until the JVM exits. WITHOUT this, H2
#                         drops an in-memory database the moment the last connection
#                         closes - so HikariCP reaping an idle connection would silently
#                         destroy your schema mid-run. A genuinely confusing bug to debug.
spring.datasource.url=jdbc:h2:mem:movemate;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# -------------------------------------------------------------------
#  Schema: Hibernate here, Flyway everywhere else
# -------------------------------------------------------------------
#  Flyway is DISABLED for this profile. The migrations in db/migration are written in
#  MySQL dialect (AUTO_INCREMENT, ENGINE=InnoDB, utf8mb4, NOW(6)) and H2 will not run
#  them. Maintaining a second H2-dialect copy of every migration would mean two schemas
#  to keep in sync, which is worse than the alternative below.
spring.flyway.enabled=false

#  So for dev only, Hibernate generates the schema from the entity mappings.
#  create-drop rebuilds it on every start, which guarantees a clean, predictable state
#  and means a stale dev schema can never confuse you.
#
#  Note what this implies, and say it out loud in an interview: the dev schema comes from
#  the ENTITIES while the production schema comes from the MIGRATIONS. They can drift.
#  The protection is that production never uses this profile, and any schema change must
#  be written as a migration to reach it.
spring.jpa.hibernate.ddl-auto=create-drop

#  H2 has no NOT-NULL-safe equivalent of some MySQL defaults, so let Hibernate decide.
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# -------------------------------------------------------------------
#  Seed data
# -------------------------------------------------------------------
#  The service catalogue and sample reviews normally arrive via the Flyway migration
#  V2__seed_catalog.sql, which is disabled here. DataSeeder fills them in instead,
#  but only when the tables are empty - so it is a no-op against a real MySQL database
#  that the migration already populated. One code path, both environments.

# -------------------------------------------------------------------
#  Developer conveniences
# -------------------------------------------------------------------
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.movemate=DEBUG

#  The H2 web console at http://localhost:8080/h2-console is deliberately NOT enabled.
#  Switching it on requires relaxing the security filter chain and frame options, and a
#  dev-only exception in a shared SecurityConfig is exactly the kind of thing that
#  survives into production by accident. Use the admin UI or Swagger instead.
spring.h2.console.enabled=false

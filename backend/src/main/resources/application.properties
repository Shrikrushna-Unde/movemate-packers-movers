# ===================================================================
#  MoveMate API - default (local development) configuration
#
#  Syntax note used everywhere below:  ${ENV_VAR:fallback}
#  Spring reads the environment variable first and uses the fallback
#  when it is absent. That single trick is what lets the SAME jar run
#  on your laptop and on Railway without code changes - the platform
#  injects env vars, your laptop uses the fallbacks.
# ===================================================================

spring.application.name=movemate-api

# Cloud platforms (Railway, Render, Heroku) tell the app which port to bind
# by setting PORT. Locally there is no PORT, so we use 8080.
server.port=${PORT:8080}

# Return a proper JSON body (not an empty 500) when an unmapped error happens.
server.error.include-message=always

# -------------------------------------------------------------------
#  Database
# -------------------------------------------------------------------
# createDatabaseIfNotExist=true   -> first run creates the `movemate` schema for you
# allowPublicKeyRetrieval=true    -> needed for MySQL 8 default auth plugin over plain TCP
# serverTimezone=UTC              -> stops MySQL guessing your JVM timezone (a classic prod bug)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movemate?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# HikariCP pool sizing. Free-tier MySQL instances cap total connections low
# (often 25-ish), so a small pool is deliberate, not laziness.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
#  JPA / Hibernate
# -------------------------------------------------------------------
# ddl-auto=none is the important one. Hibernate must NEVER create or alter
# tables here - Flyway owns the schema. `update` is convenient in a tutorial
# and a liability in production (it silently drifts and cannot be reviewed).
spring.jpa.hibernate.ddl-auto=none

# open-in-view=false closes the Hibernate Session when the service method ends.
# Leaving it on (the Spring Boot default) keeps a DB connection open for the whole
# HTTP request and hides LazyInitializationException until load testing. Say this
# in an interview and you will stand out.
spring.jpa.open-in-view=false

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
#  Flyway (versioned SQL migrations)
# -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Lets Flyway adopt an existing non-empty schema instead of refusing to start.
spring.flyway.baseline-on-migrate=true

# -------------------------------------------------------------------
#  JWT
# -------------------------------------------------------------------
# HS256 requires a key of at least 256 bits (32 bytes). The dev value below is
# long enough and intentionally obvious - ALWAYS override JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:movemate-local-dev-secret-key-change-me-in-production-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
app.jwt.issuer=movemate-api

# -------------------------------------------------------------------
#  CORS - which browser origins may call this API
# -------------------------------------------------------------------
# 5173 = Vite dev server. In production this becomes your deployed frontend URL.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}

# -------------------------------------------------------------------
#  Seed data (created on startup only if missing - see DataSeeder)
# -------------------------------------------------------------------
app.admin.email=${ADMIN_EMAIL:admin@movemate.in}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.full-name=MoveMate Admin

# -------------------------------------------------------------------
#  Pricing knobs - the quote engine reads these, so you can retune
#  prices by changing config instead of recompiling Java.
# -------------------------------------------------------------------
app.pricing.free-distance-km=25
app.pricing.packing-percent=18
app.pricing.per-floor-charge=350
app.pricing.insurance-percent=2.5
app.pricing.min-insurance-charge=400
app.pricing.storage-per-day=100
app.pricing.gst-percent=18
app.pricing.quote-validity-days=7

# -------------------------------------------------------------------
#  Swagger / OpenAPI + Actuator
# -------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

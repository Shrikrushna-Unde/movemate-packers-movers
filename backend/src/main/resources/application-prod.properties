# ===================================================================
#  Production overrides - activated with SPRING_PROFILES_ACTIVE=prod
#
#  Only the values that MUST differ in production live here. Everything
#  else is inherited from application.properties. That is the whole point
#  of Spring profiles: one base file plus a small diff per environment.
# ===================================================================

# Never log SQL in production: it is slow, noisy and can leak customer data
# (addresses, phone numbers) into platform log aggregators.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Do not echo exception messages to API clients in production.
server.error.include-message=never
server.error.include-stacktrace=never

# Shrink framework logging, keep our own package at INFO so bookings stay traceable.
logging.level.root=WARN
logging.level.com.movemate=INFO
logging.level.org.hibernate.SQL=WARN

# Gzip JSON responses - cheap latency win on free-tier bandwidth.
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# Graceful shutdown: let in-flight requests finish when the platform
# sends SIGTERM during a redeploy, instead of dropping them.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
